name: seeker_workroom
description: Remember the reason behind your work and wallet decisions.
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: 2.4.2
  path: 1.9.1
  uuid: 4.5.1
  firebase_core: 4.1.1
  firebase_auth: 6.1.0
  cloud_firestore: 6.0.2
  http: 1.5.0
  bs58: 1.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
