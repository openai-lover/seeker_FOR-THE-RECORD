<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title description">
  <title id="title">FOR THE RECORD</title>
  <desc id="description">For the record, this is why I did it. A private Android journal for work and wallet decisions. Original white F mark with a coral record dot on an ink background.</desc>
  <rect width="1600" height="780" fill="#191F28"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <circle cx="104" cy="94" r="7" fill="#FF6B4A"/>
    <text x="125" y="102" fill="#D5F56B" font-size="23" font-weight="600" letter-spacing="2">KEEP THE WHY.</text>
    <text x="89" y="300" fill="#FFFFFF" font-size="151" font-weight="800" letter-spacing="-6">FOR THE</text>
    <text x="85" y="470" fill="#FFFFFF" font-size="170" font-weight="800" letter-spacing="-7">RECORD</text>
    <text x="96" y="580" fill="#FFFFFF" font-size="42" font-weight="600" letter-spacing="-1">“For the record, this is why I did it.”</text>
    <text x="98" y="643" fill="#B6BFCC" font-size="26">A private Android journal for work and wallet decisions.</text>
    <path d="M98 699H1500" stroke="#3B4451"/>
    <text x="98" y="742" fill="#D5F56B" font-size="19" font-weight="600">WORK. REFLECT. REMEMBER.</text>
    <text x="1500" y="742" fill="#B6BFCC" font-size="19" text-anchor="end">English first · Eight languages · Local notes</text>
  </g>
  <g transform="translate(1165 163) scale(3.5)">
    <path d="M30 73V29H70M30 48H59" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="70" cy="69" r="10" fill="#FF6B4A"/>
  </g>
</svg>
